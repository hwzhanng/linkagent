name: Fruit Rotation PPO CPU Contract Tests

on:
  push:
    branches:
      - feature/single-hand-fruit-rotation-ppo
  pull_request:
    paths:
      - "simulation/fruit_rotation/**"
      - "script/train_fruit_rotation.py"
      - "tests/test_fruit_rotation_core.py"
      - ".github/workflows/fruit-rotation-unit.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest
      - name: Compile changed modules
        run: |
          python -m compileall -q simulation/fruit_rotation script/train_fruit_rotation.py tests/test_fruit_rotation_core.py
      - name: Pure torch unit tests
        run: |
          python -m pytest tests/test_fruit_rotation_core.py -q
      - name: Check vendor asset paths and joint contract
        run: |
          python -m script.train_fruit_rotation --preflight
