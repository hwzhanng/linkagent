seed: 42
device: cuda:0
num_steps_per_env: 32
max_iterations: 1800
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - critic
clip_actions: 1.0
check_for_nan: true
save_interval: 50
experiment_name: tomato_pick_physics_v1
run_name: tomato_pick_physics_v1_from_scratch_8192
logger: wandb
neptune_project: isaaclab
wandb_project: PPO
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.6
    std_type: log
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 4
  num_mini_batches: 8
  learning_rate: 0.0003
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.002
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
