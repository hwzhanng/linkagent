{
  "models_file": "_model.yaml",
  "perception_file": "_perception.yaml",
  "agent": {
    "model": "offline_harvest_ark_vision",
    "max_iterations": 13,
    "max_tool_calls": 12,
    "max_tool_calls_per_turn": 1
  },
  "env": {
    "type": "mock",
    "observations": [
      {
        "sequence": 0,
        "timestamp_s": 0.0,
        "metadata": {
          "tomato_vision_worker": {"capture_latest": "latest.json"}
        }
      }
    ]
  },
  "task": {
    "type": "harvest_cycle",
    "default_arm_side": "right",
    "max_skill_duration_s": 4.0,
    "max_atomic_duration_s": 8.0,
    "robotics": {"type": "mock", "scenario": {"outcome": "success"}},
    "skill": {"type": "mock"},
    "perception": {
      "type": "tomato_vision_worker",
      "endpoint": "http://127.0.0.1:18766",
      "capture_root": "artifacts/vision_spool/ark-synthetic-fixed-clock",
      "worker_id": "tomato-vision-ark-box-01",
      "timeout_s": 70.0,
      "expected_calibration_id": "synthetic-orbbec-aligned-rgbd-v1",
      "expected_device_id": "synthetic-rgbd-camera-001"
    },
    "planner": {"type": "training_distribution"},
    "safety": {"type": "mock"},
    "verifier": {"type": "mock"},
    "atomic_skills": {
      "system_self_check": {
        "type": "system_self_check",
        "execution_mode": "offline_mock",
        "expected_camera_calibration_id": "synthetic-orbbec-aligned-rgbd-v1"
      },
      "active_view_reposition": {
        "type": "active_view_reposition",
        "execution_mode": "offline_mock",
        "view_profile_id": "offline-ark-fixed-top-arm-parallax-v1",
        "view_arm_side": "right",
        "view_offsets_world_m": [[0.0, 0.05, 0.0], [0.0, -0.05, 0.0], [0.0, 0.0, 0.05]],
        "workspace_min_m": [-0.20, -0.80, 0.20],
        "workspace_max_m": [0.80, 0.80, 1.40]
      },
      "select_harvest_target": {
        "type": "select_harvest_target",
        "reachability_profile_id": "offline-ark-right-arm-workspace-v1",
        "reachability_arm_side": "right",
        "workspace_min_m": [0.20, -0.60, 0.30],
        "workspace_max_m": [0.80, 0.20, 1.20]
      },
      "target_reobserve": {
        "type": "target_reobserve",
        "require_depth": true,
        "require_new_sample": false
      },
      "pregrasp_clearance_check": {"type": "pregrasp_clearance_check"},
      "move_to_pick_ready": {"type": "move_to_pick_ready", "execution_mode": "offline_mock"},
      "safe_retract": {"type": "safe_retract"},
      "payload_retreat": {"type": "payload_retreat"},
      "transport_payload": {"type": "transport_payload"},
      "payload_place": {"type": "payload_place"},
      "localize_dropped_payload": {
        "type": "localize_dropped_payload",
        "recovery_workspace_xyzxyz_m": [-0.20, -0.80, 0.0, 0.80, 0.80, 0.50]
      },
      "reset_for_next_target": {"type": "reset_for_next_target"}
    },
    "camera_health": {
      "type": "mock",
      "calibration_id": "synthetic-orbbec-aligned-rgbd-v1"
    },
    "vision_worker_health": {
      "type": "loopback",
      "endpoint": "http://127.0.0.1:18766",
      "capture_root": "artifacts/vision_spool/ark-synthetic-fixed-clock",
      "worker_id": "tomato-vision-ark-box-01",
      "timeout_s": 70.0
    },
    "emergency_stop_health": {"type": "mock"},
    "target_observation": {
      "type": "tomato_vision_worker",
      "endpoint": "http://127.0.0.1:18766",
      "capture_root": "artifacts/vision_spool/ark-synthetic-fixed-clock",
      "worker_id": "tomato-vision-ark-box-01",
      "timeout_s": 70.0,
      "expected_calibration_id": "synthetic-orbbec-aligned-rgbd-v1",
      "expected_device_id": "synthetic-rgbd-camera-001"
    },
    "clearance_scene": {"type": "mock"},
    "dropped_payload_observation": {"type": "mock"},
    "placement_verifier": {"type": "mock"},
    "container": {
      "container_id": "harvest-bin-1",
      "placement_pose": {
        "position_m": [0.35, 0.40, 0.65],
        "quaternion_wxyz": [1.0, 0.0, 0.0, 0.0],
        "frame_id": "world"
      },
      "available": true,
      "capacity_remaining": 20
    },
    "safe_pose": {
      "position_m": [0.0, 0.0, 0.80],
      "quaternion_wxyz": [1.0, 0.0, 0.0, 0.0],
      "frame_id": "world"
    }
  },
  "runtime": {"max_steps": 1}
}
