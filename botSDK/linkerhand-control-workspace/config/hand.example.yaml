# 复制为 hand.yaml 后再填写。不要在配置中保存 sudo 密码。
armed: false

hand:
  model: null          # O6/L6/L7/L10/L20/G20/L21/L25
  side: null           # left/right
  touch: null          # true/false

transport:
  type: null           # can/rs485
  can_interface: null  # 例如 can0
  serial_port: null    # 例如 /dev/ttyUSB0
  bitrate: 1000000

motion:
  speed: 30
  torque: 30
  settle_seconds: 2.0

